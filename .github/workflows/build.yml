name: Build package and publish release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_NAME: python-simpleline-l10n

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build from the checked-out source tree
        run: |
          mkdir -p artifact-out
          docker run --rm \
            -v "$PWD:/src" \
            -v "$PWD/artifact-out:/out" \
            -w /src \
            -e PACKAGE_NAME="${{ env.PACKAGE_NAME }}" \
            registry.fedoraproject.org/fedora:45 bash -c '
              set -euo pipefail
              dnf install -y -q --setopt=install_weak_deps=False \
                rpm-build rpmdevtools dnf-plugins-core make git tar gzip xz findutils \
                autoconf automake libtool gettext python3-devel python3-build nodejs npm
              case "$PACKAGE_NAME" in
                anaconda)
                  dnf builddep -y -q anaconda.spec.in || true
                  make -f Makefile.am rpms
                  find result/build/01-rpm-build -type f -name "*.rpm" -exec cp {} /out/ \;
                  ;;
                anaconda-webui)
                  make srpm
                  rpmbuild --rebuild --define "_rpmdir /tmp/rpms" ./*.src.rpm
                  find /tmp/rpms -type f -name "*.rpm" -exec cp {} /out/ \;
                  ;;
                *)
                  if make -n local >/dev/null 2>&1; then make local; \
                  elif make -n archive >/dev/null 2>&1; then make archive; fi
                  SPEC=$(find . -maxdepth 3 -type f -name "*.spec" | head -1 || true)
                  if [ -n "$SPEC" ]; then
                    rpmdev-setuptree
                    cp "$SPEC" "$HOME/rpmbuild/SPECS/"
                    while IFS= read -r src; do cp "$src" "$HOME/rpmbuild/SOURCES/"; done < <(find . -maxdepth 3 -type f \( -name "*.tar.gz" -o -name "*.tar.xz" -o -name "*.tar.bz2" \))
                    dnf builddep -y -q --setopt=minrate=0 --setopt=timeout=60 --setopt=retries=10 "$SPEC" || true
                    rpmbuild -ba --nocheck "$HOME/rpmbuild/SPECS/$(basename "$SPEC")"
                    find "$HOME/rpmbuild/RPMS" "$HOME/rpmbuild/SRPMS" -type f -name "*.rpm" -exec cp {} /out/ \; 2>/dev/null || true
                  fi
                  ;;
              esac
              if [ "$(find /out -type f | wc -l)" -eq 0 ]; then
                tar czf "/out/$PACKAGE_NAME-$(git rev-parse --short HEAD).tar.gz" --exclude=.git --exclude=artifact-out .
              fi
              ls -la /out
            '

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="ci-${GITHUB_SHA::12}"
          shopt -s nullglob
          artifacts=(artifact-out/*)
          [ ${#artifacts[@]} -gt 0 ] || { echo "No artifacts produced"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${artifacts[@]}" --clobber
          else
            gh release create "$TAG" "${artifacts[@]}" --generate-notes
          fi
